<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUUR HOME COLLECTION</title>
<meta name="description" content="NUUR HOME COLLECTION — katalog, Instagram, Telegram va buyurtma uchun havolalar.">
<meta name="theme-color" content="#f6f1e9">
<link rel="icon" href="logo.png">
<meta property="og:title" content="NUUR HOME COLLECTION">
<meta property="og:image" content="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9; --bg2:#efe6d8; --card:rgba(255,255,255,.72); --line:rgba(120,95,60,.14);
    --text:#2b2218; --muted:#857560; --gold:#b08a4f; --gold2:#d9b87c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14110d; --bg2:#1d1812; --card:rgba(255,255,255,.05); --line:rgba(217,184,124,.16);
      --text:#f3ece0; --muted:#a8987f; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:Manrope,system-ui,sans-serif; color:var(--text);
    background:radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 60%);
    background-color:var(--bg);
    display:flex; justify-content:center; padding:56px 16px 40px; overflow-x:hidden;
  }
  .blob{position:fixed; border-radius:50%; filter:blur(70px); opacity:.35; z-index:0; pointer-events:none}
  .b1{width:260px;height:260px;background:var(--gold2);top:-60px;left:-80px;animation:float 12s ease-in-out infinite}
  .b2{width:220px;height:220px;background:#c9a27a;bottom:-40px;right:-70px;animation:float 14s ease-in-out infinite reverse}
  @keyframes float{50%{transform:translate(30px,40px)}}

  main{position:relative;z-index:1;width:100%;max-width:440px;text-align:center}
  .avatar{
    width:116px;height:116px;margin:0 auto 18px;border-radius:50%;padding:4px;
    background:conic-gradient(from 200deg,var(--gold),var(--gold2),var(--gold));
    box-shadow:0 12px 40px rgba(176,138,79,.28);
  }
  .avatar .logo{background:#111826 center/150% no-repeat}
  .avatar img,.avatar span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;object-fit:cover;
    background:#1b1a2a;color:var(--gold2);font:700 38px "Cormorant Garamond",serif;border:3px solid var(--bg)}
  h1{font:700 32px/1.1 "Cormorant Garamond",serif;letter-spacing:.04em}
  .tagline{color:var(--muted);font-size:14px;margin:8px 0 6px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gold);font-weight:600;
    border:1px solid var(--line);padding:5px 12px;border-radius:99px;background:var(--card);backdrop-filter:blur(8px)}
  .badge i{width:7px;height:7px;border-radius:50%;background:#3fb26b;box-shadow:0 0 0 3px rgba(63,178,107,.2)}

  .links{display:flex;flex-direction:column;gap:12px;margin-top:28px}
  .link{
    display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);backdrop-filter:blur(12px);
    box-shadow:0 2px 10px rgba(60,40,10,.05);
    transition:transform .2s, box-shadow .2s, border-color .2s;
    opacity:0;animation:rise .5s ease forwards;
  }
  .link:hover,.link:focus-visible{transform:translateY(-2px);border-color:var(--gold2);box-shadow:0 10px 28px rgba(176,138,79,.18);outline:none}
  .link:active{transform:scale(.98)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff}
  .ic{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.12)}
  .ic svg{width:21px;height:21px}
  .arrow svg{width:12px;height:12px;display:block}
  .txt{flex:1;text-align:left;min-width:0}
  .txt b{display:block;font-size:15px;font-weight:700}
  .txt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{color:var(--muted);transition:transform .2s}
  .link:hover .arrow{transform:translateX(3px);color:var(--gold)}
  .link.main{background:linear-gradient(135deg,var(--gold),#8a6a3a);color:#fff;border:none}
  .link.main .txt small,.link.main .arrow{color:rgba(255,255,255,.8)}
  .link.main .ic{background:rgba(255,255,255,.18)!important}

  .info{margin-top:26px;display:grid;gap:6px;font-size:13px;color:var(--muted)}
  footer{margin-top:28px;font-size:12px;color:var(--muted);opacity:.8}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
